[package]
name = "task-manager"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
axum = "0.7"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

diesel = { version = "2.1", features = ["postgres", "chrono", "r2d2"] }
deadpool-diesel = { version = "0.6", features = ["postgres"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "8.0.0"  # or "11.0.0"
bcrypt = "0.15"
chrono = { version = "0.4.45", features = ["serde"] }  # Updated feature
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

